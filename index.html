<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/weaveit-logo.png" />
  <link rel="apple-touch-icon" href="/weaveit-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="A modern Hacker News reader by Weaveit — Top, New, Ask, Show, Jobs, Algolia search, in-app comments, dark mode, and local bookmarks."
  />
  <meta name="author" content="Weaveit" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#ff6600" />
  <meta name="application-name" content="Hacker News by Weaveit" />
  <link rel="canonical" href="https://hn.weaveit.app/" />

  <!-- Critical first-paint styles (avoids FOUC while main CSS loads async) -->
  <style>
    :root {
      --hn-orange: #ff6600;
      --bg-color: #fafafa;
      --surface-color: #ffffff;
      --text-primary: #111111;
      --text-secondary: #777777;
      --border-color: #eaeaea;
      --header-bg: rgba(255, 255, 255, 0.85);
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --bg-glow-1: rgba(255, 102, 0, 0.22);
      --bg-glow-2: rgba(255, 140, 40, 0.14);
      --bg-glow-3: rgba(255, 102, 0, 0.1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --surface-color: #1e1e1e;
        --text-primary: #ededed;
        --text-secondary: #a1a1aa;
        --border-color: #2d2d2d;
        --header-bg: rgba(30, 30, 30, 0.85);
        --bg-glow-1: rgba(255, 102, 0, 0.18);
        --bg-glow-2: rgba(255, 120, 20, 0.12);
        --bg-glow-3: rgba(255, 102, 0, 0.08);
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-color);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    body {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 55% at 12% -5%, var(--bg-glow-1), transparent 60%),
        radial-gradient(ellipse 55% 45% at 92% 8%, var(--bg-glow-2), transparent 55%),
        radial-gradient(ellipse 60% 50% at 50% 105%, var(--bg-glow-3), transparent 55%);
      filter: blur(48px);
    }
    #root { min-height: 100vh; }
  </style>

  <!-- Open Graph -->
  <meta property="og:site_name" content="Hacker News by Weaveit" />
  <meta property="og:title" content="Hacker News by Weaveit" />
  <meta
    property="og:description"
    content="Read Hacker News with a cleaner UI, dark mode, search, comment threads, and local bookmarks."
  />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:url" content="https://hn.weaveit.app/" />
  <meta property="og:image" content="https://hn.weaveit.app/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="675" />
  <meta property="og:image:alt" content="Hacker News by Weaveit" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Hacker News by Weaveit" />
  <meta
    name="twitter:description"
    content="Read Hacker News with a cleaner UI, dark mode, search, comment threads, and local bookmarks."
  />
  <meta name="twitter:image" content="https://hn.weaveit.app/og-image.png" />
  <meta name="twitter:image:alt" content="Hacker News by Weaveit" />

  <title>Hacker News by Weaveit</title>

  <!-- Privacy-friendly analytics by Plausible (first-party proxy) -->
  <script defer src="/v1/p"></script>
  <script>
    window.plausible = window.plausible || function () {
      (plausible.q = plausible.q || []).push(arguments);
    };
    plausible.init = plausible.init || function (i) {
      plausible.o = i || {};
    };
    plausible.init({ endpoint: '/v1/e' });
  </script>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Hacker News by Weaveit",
      "applicationCategory": "NewsApplication",
      "operatingSystem": "Any",
      "description": "A modern Hacker News reader by Weaveit with feeds, search, comments, and bookmarks.",
      "url": "https://hn.weaveit.app/",
      "image": "https://hn.weaveit.app/og-image.png",
      "creator": {
        "@type": "Organization",
        "name": "Weaveit",
        "url": "https://weaveit.app/"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
